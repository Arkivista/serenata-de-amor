version: "3.9"

services:
  led-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.example
    ports:
      - "8080:8000"
    volumes:
      - led_uploads:/data/uploads
    depends_on:
      - led-db

  led-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: led
      POSTGRES_USER: led
      POSTGRES_PASSWORD: led
    volumes:
      - led_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  led_uploads:
  led_pgdata:
