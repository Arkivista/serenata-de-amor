version: "3.9"

services:
  led-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.example
    ports:
      - "8080:8000"
    volumes:
      - led_uploads:/data/uploads
    depends_on:
      - led-db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  led-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: led
      POSTGRES_USER: led
      POSTGRES_PASSWORD: led
    volumes:
      - led_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  led_uploads:
  led_pgdata:
